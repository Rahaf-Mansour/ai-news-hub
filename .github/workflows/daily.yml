name: Daily update

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC every day. Keep in sync with DAILY_RUN_UTC in src/lib/schedule.ts (a unit test checks).
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: daily-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to commit the day's data back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Only scheduled and manual runs fetch new data; pushes and PRs test what is committed.
      - name: Fetch sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run ingest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # built in; lifts the GitHub API rate limit for repo stars
          # The LLM step is off for this public repo by choice: no API key is
          # stored here. It can still run locally (see README).
          ENABLE_LLM: 'false'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b && npx tsc -p cypress/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Same command as locally: start-server-and-test starts `vite preview`,
      # retries until it answers, runs Cypress, then stops the server.
      # (cypress-io/github-action@v6's wait-on fails at once on the Node 24
      # runtime GitHub now forces it onto.)
      - name: Cypress E2E
        run: npm run cy:run

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      # Tests passed: keep today's data in git so the archive persists.
      - name: Commit data
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data: daily run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload site for GitHub Pages
        if: vars.ENABLE_PAGES_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Off until you set the repository variable ENABLE_PAGES_DEPLOY=true
  # (Settings → Secrets and variables → Actions → Variables) and choose
  # "GitHub Actions" as the Pages source.
  deploy:
    needs: build
    if: vars.ENABLE_PAGES_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
